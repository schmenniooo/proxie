version: "3"

# Everything runs in Docker (see compose.yaml); only Docker and Task are
# needed on the host.

vars:
  GO: COMPOSE_PROGRESS=quiet docker compose run --rm go
  LINT: COMPOSE_PROGRESS=quiet docker compose run --rm lint

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the proxie Docker image
    cmds:
      - docker compose build proxie

  run:
    desc: Run proxie and Redis (env vars from .env, copy .env.example)
    cmds:
      - docker compose up --build proxie

  down:
    desc: Stop and remove the proxie and Redis containers
    cmds:
      - docker compose down

  test:
    desc: Run all tests (pass a package or flags after --, e.g. task test -- -run TestHello ./internal/server)
    cmds:
      - "{{.GO}} go test {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}"

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.LINT}} golangci-lint run ./..."

  fmt:
    desc: Format code with golangci-lint
    cmds:
      - "{{.LINT}} golangci-lint fmt ./..."

  check:
    desc: Everything CI should run - lint, then test
    cmds:
      - task: lint
      - task: test
