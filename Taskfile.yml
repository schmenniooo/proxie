version: "3"

# Everything runs in Docker (see compose.yaml); only Docker and Task are
# needed on the host.

vars:
  GO: COMPOSE_PROGRESS=quiet docker compose run --rm go
  LINT: COMPOSE_PROGRESS=quiet docker compose run --rm lint
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || echo unknown

env:
  # Build args of the proxie image (compose.yaml).
  PROXIE_VERSION: "{{.VERSION}}"
  PROXIE_COMMIT: "{{.COMMIT}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the proxie Docker image
    cmds:
      - docker compose build proxie

  cli:
    # Development runs the CLI only in Docker, never as a host binary, so it
    # cannot be confused with an installed proxie.
    desc: Run a proxie command in the compose setup (env from .env), e.g. task cli -- doctor
    cmds:
      - COMPOSE_PROGRESS=quiet docker compose run --rm --build proxie {{.CLI_ARGS}}

  run:
    desc: Run proxie and Redis (env vars from .env, copy .env.example)
    cmds:
      - docker compose up --build proxie

  down:
    desc: Stop and remove the proxie and Redis containers
    cmds:
      - docker compose down

  test:
    desc: Run all tests (pass a package or flags after --, e.g. task test -- -run TestHello ./internal/server)
    cmds:
      - "{{.GO}} go test {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}./...{{end}}"

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.LINT}} golangci-lint run ./..."

  fmt:
    desc: Format code with golangci-lint
    cmds:
      - "{{.LINT}} golangci-lint fmt ./..."

  check:
    desc: Everything CI should run - lint, then test
    cmds:
      - task: lint
      - task: test
