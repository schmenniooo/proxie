# Local development. Use the Taskfile (`task test`, `task lint`, `task run`)
# instead of calling compose directly.

name: proxie

x-go-tool: &go-tool
  working_dir: /src
  volumes:
    - .:/src
    - go-mod:/go/pkg/mod
    - go-cache:/root/.cache
  profiles: [tools]

services:
  # Runs go commands (tests) with the same Go version as the Dockerfile.
  go:
    <<: *go-tool
    image: golang:1.27.3
    environment:
      # Lets the cache tests also run against a real Redis.
      PROXIE_TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      redis:
        condition: service_healthy

  # Same golangci-lint version as CI.
  lint:
    <<: *go-tool
    image: golangci/golangci-lint:v2.15.0

  # Sends a test request to proxie from inside the compose network
  # (task request), built from the TEST_* values in .env.test. Only this
  # service loads .env.test, so the provider key never reaches proxie.
  curl:
    image: curlimages/curl:8.11.1
    profiles: [tools]
    env_file:
      - path: .env.test
        required: false
    entrypoint: ["sh", "-c"]

  redis:
    image: redis:8.0-alpine
    # Same eviction setup production Redis needs (see docs/design.md).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  proxie:
    build:
      context: .
      # Set by the Taskfile from git, shown by `proxie version`.
      args:
        VERSION: ${PROXIE_VERSION:-dev}
        COMMIT: ${PROXIE_COMMIT:-unknown}
    ports:
      - "${PROXIE_PORT:-8080}:8080"
    # proxie's own settings only (see .env.proxie.example).
    env_file:
      - path: .env.proxie
        required: false
    environment:
      PROXIE_REDIS_URL: redis://redis:6379
      PROXIE_ADDR: ":8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  go-mod:
  go-cache:
